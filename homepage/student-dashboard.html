<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student dashboard · DPS Millennium</title><style>@font-face{font-family:Plex;src:url('assets/fonts/plex-sans-400.woff2')}@font-face{font-family:Plex;src:url('assets/fonts/plex-sans-500.woff2');font-weight:500}@font-face{font-family:Plex;src:url('assets/fonts/plex-sans-600.woff2');font-weight:600}@font-face{font-family:PlexSerif;src:url('assets/fonts/plex-serif-600.woff2');font-weight:600}
:root{--purple:#400068;--deep:#2b0046;--ink:#211329;--green:#206838;--gold:#d8a800;--paper:#f6f3f7;--muted:#786b7f;--line:#e9e2ec;--lav:#efe8f3;--r:14px;--shadow:0 1px 2px #2f12310a,0 12px 32px #2f12310a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 Plex,system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,select,input,textarea{font:inherit}button{cursor:pointer}svg{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rail{position:fixed;inset:0 auto 0 0;width:252px;background:linear-gradient(180deg,var(--purple),var(--deep));color:#fff;padding:22px 14px;display:flex;flex-direction:column;z-index:5}
.brand{display:flex;gap:12px;align-items:center;padding:4px 10px 22px;border-bottom:1px solid #ffffff1f;margin-bottom:14px}.brand img{width:44px;height:44px}.brand b{font:600 16px/1.15 PlexSerif,Georgia,serif;display:block}.brand small{font-size:10px;color:#d9c8e4;letter-spacing:.1em;text-transform:uppercase}
.rail nav{display:grid;gap:3px}.rail nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#e3d4ea;position:relative;transition:background .2s,color .2s}.rail nav a:hover{background:#ffffff14;color:#fff}.rail nav a.on{background:#ffffff1f;color:#fff;font-weight:500}.rail nav a.on:before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.me{margin-top:auto;padding:14px 10px 0;border-top:1px solid #ffffff1f;display:flex;align-items:center;gap:11px;font-size:12px}.me b{display:block;font-weight:500}.me small{color:#cdb9d8}.me a{margin-left:auto;color:#e3d4ea;padding:6px;border-radius:8px}.me a:hover{background:#ffffff14}
.av{width:36px;height:36px;border-radius:50%;background:#f0dfb0;color:var(--purple);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.main{margin-left:252px;min-height:100vh;display:flex;flex-direction:column}
.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,56px);background:#ffffffdb;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--purple);font-weight:600}.tools{display:flex;align-items:center;gap:12px}.bell{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:50%;color:var(--purple);display:grid;place-items:center}.bell:hover{background:var(--lav)}
.page{flex:1;width:100%;max-width:1480px;margin:auto;padding:32px clamp(20px,4vw,56px) 40px}
.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}.eyebrow{color:var(--green);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h1{font:600 clamp(28px,3vw,38px)/1.12 PlexSerif,Georgia,serif;color:var(--purple);letter-spacing:-.025em;margin:6px 0 4px}.welcome p{margin:0;color:var(--muted)}
.pick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:12px;color:var(--muted)}.pick select{border:0;background:none;color:var(--purple);font-weight:600;outline:0}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.cards{grid-template-columns:repeat(12,1fr);align-items:stretch}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;scroll-margin-top:86px;animation:rise .5s both;min-width:0}
.stat{display:flex;gap:14px;align-items:center;padding:18px 20px;position:relative;overflow:hidden}.stat:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--gold);opacity:.85}
.chip{width:40px;height:40px;border-radius:11px;background:var(--lav);color:var(--purple);display:grid;place-items:center;flex:none}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;line-height:1.15;color:var(--purple);letter-spacing:-.02em}.stat strong.nil{color:#c3b7c9}.stat em{display:block;font-style:normal;font-size:11px;color:var(--muted)}.stat em.g{color:var(--green)}.stat em.r{color:#b3472f}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.head .chip{width:32px;height:32px;border-radius:9px}.head svg{width:16px;height:16px}.head h2{font:600 18px PlexSerif,Georgia,serif;color:var(--purple);margin:0;letter-spacing:-.01em}
.empty{height:calc(100% - 46px);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;border:1.5px dashed #ddd2e3;border-radius:11px;padding:20px;background:#fcfbfd}.empty svg{width:26px;height:26px;color:#b9a6c4;margin-bottom:6px}.empty b{font-size:13px;color:#5b4a66;font-weight:600}.empty small{font-size:12px;color:var(--muted);max-width:260px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0;padding-top:0}.row b{display:block;font-size:13px;font-weight:600}.row small{font-size:12px;color:var(--muted)}a.row:hover b{color:var(--purple)}
.tag{border-radius:99px;padding:3px 9px;font-size:11px;font-weight:600;background:#f5edcf;color:#77600b;white-space:nowrap}.tag.g{background:#e6f1e7;color:#28633a}.tag.r{background:#f8e3df;color:#a2402b}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;border-bottom:1px solid var(--line)}.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;color:var(--muted)}.bars span{color:var(--purple);font-weight:600}.bars i{display:block;width:100%;max-width:34px;height:var(--h);background:linear-gradient(180deg,#b08fc4,var(--purple));border-radius:6px 6px 2px 2px;transform-origin:bottom;animation:grow .8s both}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em}td,th{padding:10px 6px}td{border-top:1px solid var(--line)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.links button{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;transition:.2s}.links button:hover{transform:translateY(-3px);border-color:#cbb8d5;box-shadow:0 12px 24px #2f123114}.links b{display:block;font-size:13px;color:var(--purple);font-weight:600}.links small{font-size:12px;color:var(--muted)}
form.leave{display:grid;gap:10px}form.leave label{display:grid;gap:4px;font-size:12px;color:var(--muted)}form.leave input,form.leave textarea{border:1px solid #ddd2e3;border-radius:9px;padding:9px 11px;font-size:13px;width:100%;background:#fff}form.leave .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--purple);color:#fff;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:600}.btn:hover{background:var(--deep)}
.foot{padding:18px clamp(20px,4vw,56px);font-size:11px;color:#9a8da1;border-top:1px solid var(--line);text-align:center}
.toast{position:fixed;right:24px;bottom:24px;background:var(--purple);color:#fff;padding:12px 16px;border-radius:10px;font-size:12px;opacity:0;transform:translateY(16px);transition:.25s;pointer-events:none;z-index:9;box-shadow:0 10px 30px #16001c40}.toast.show{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes grow{from{transform:scaleY(0)}}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.card[style]{grid-column:span 6!important}}
@media(max-width:820px){.rail{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{border:0;margin:0;padding:0 8px 8px}.rail nav{display:flex;overflow-x:auto;width:100%}.rail nav a span{white-space:nowrap}.rail nav a.on:before{display:none}.me{display:none}.main{margin:0}.card[style]{grid-column:1/-1!important}.stats{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto}}
</style></head>

const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* section = [id,title,kind,icon,span,emptyTitle,emptyHint,(links)] */
const CFG={
student:{label:'Student',title:'Student dashboard',sub:'Your classes, homework, exams and notices in one place.',
 stats:[['Attendance','check'],['Homework due','book'],['Next exam','cal'],['Overall grade','chart']],
 secs:[['timetable','Today’s timetable','list','clock',4,'No classes to show','Your timetable appears here once classes are scheduled.'],
 ['homework','Homework','list','book',4,'No homework assigned','Assignments from your teachers will appear here.'],
 ['exams','Upcoming exams','list','file',4,'No exams scheduled','Exam dates will be listed here once published.'],
 ['results','Subject performance','bars','chart',7,'No results yet','Marks will appear after your first assessment.'],
 ['notices','Notice board','list','bell',5,'No notices','School circulars and announcements will appear here.'],
 ['resources','School resources','links','folder',12,'','',[['Library','Search and reserve books','book'],['Report card','View and download','file'],['Academic calendar','Terms and holidays','cal'],['E-learning','Notes and videos','edit'],['Apply for leave','Request an absence','msg']]]]},
parent:{label:'Parent',title:'Parent dashboard',sub:'Follow your child’s progress, fees and school updates.',
 stats:[['Attendance','check'],['Overall grade','chart'],['Fees due','wallet'],['Messages','msg']],
 secs:[['progress','Academic progress','bars','chart',6,'No results yet','Your child’s marks will appear after assessments.'],
 ['fees','Fee status','table','wallet',6,'No fee records','Invoices and payment history will appear here.'],
 ['messages','Messages and meetings','list','msg',4,'No messages','Teacher messages and PTM bookings will appear here.'],
 ['leave','Apply for leave','leave','edit',4],
 ['transport','School bus','list','bus',4,'No transport assigned','Route and pickup details will appear here.'],
 ['circulars','Circulars and events','list','bell',12,'No circulars','School announcements and events will appear here.']]},
faculty:{label:'Faculty',title:'Faculty dashboard',sub:'Your classes, attendance, grading and staff notices.',
 stats:[['Classes today','clock'],['Attendance pending','check'],['To grade','edit'],['Parent messages','msg']],
 secs:[['schedule','Today’s schedule','list','clock',4,'No classes today','Your teaching schedule appears here.'],
 ['attendance','Mark attendance','list','check',4,'Nothing to mark','Classes awaiting attendance will appear here.'],
 ['grading','Grading queue','table','edit',4,'Nothing to grade','Submitted work waiting for marks will appear here.'],
 ['performance','Class performance','bars','chart',7,'No data yet','Class averages appear after marks are entered.'],
 ['notices','Staff notices','list','bell',5,'No notices','Staff circulars and deadlines will appear here.'],
 ['actions','Quick actions','links','folder',12,'','',[['Post homework','Set work for a class','book'],['Enter marks','Record assessment results','edit'],['Message parents','Individual or whole class','msg'],['Upload notes','Share files with classes','file'],['Request leave','Apply for time off','cal']]]]}
};
const role=document.body.dataset.role,C=CFG[role],D=window.PORTAL_DATA||{},kids=D.children||[],$=s=>document.querySelector(s);
let sel=0;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),2400)};
const empty=(i,t,h)=>`<div class="empty">${S(i)}<b>${t}</b><small>${h}</small></div>`;
function body(s,d){const [id,,k,ic,,et,eh,ln]=s,v=d[id];
 if(k=='leave')return `<form class="leave"><div class="two"><label>From<input type="date" required></label><label>To<input type="date" required></label></div><label>Reason<textarea rows="3" placeholder="Brief reason for absence"></textarea></label><button class="btn">Submit request</button></form>`;
 if(k=='links')return `<div class="links">${ln.map(l=>`<button type="button"><span class="chip">${S(l[2])}</span><span><b>${l[0]}</b><small>${l[1]}</small></span></button>`).join('')}</div>`;
 if(k=='list'&&v&&v.length)return v.map(r=>{const t=`<div><b>${E(r.t)}</b><small>${E(r.s)}</small></div>${r.tag?`<span class="tag ${r.tone||''}">${E(r.tag)}</span>`:''}`;return r.href?`<a class="row" href="${E(r.href)}">${t}</a>`:`<div class="row">${t}</div>`}).join('');
 if(k=='bars'&&v&&v.length)return `<div class="bars">${v.map((r,j)=>`<div title="${E(r.l)}: ${E(r.v)}%"><span>${E(r.v)}</span><i style="--h:${Math.min(+r.v||0,100)}%;animation-delay:${j*60}ms"></i>${E(r.l)}</div>`).join('')}</div>`;
 if(k=='table'&&v&&v.rows&&v.rows.length)return `<table><tr>${v.head.map(h=>`<th>${E(h)}</th>`).join('')}</tr>${v.rows.map(r=>`<tr>${r.map(c=>`<td>${typeof c=='object'?`<span class="tag ${c.tone||''}">${E(c.t)}</span>`:E(c)}</td>`).join('')}</tr>`).join('')}</table>`;
 return empty(ic,et,eh)}
function draw(){const d=kids.length?{...D,...kids[sel]}:D,st=d.stats||{};
 $('#stats').innerHTML=C.stats.map(([l,ic])=>{const x=st[l],o=typeof x=='object'?x:{v:x};return `<div class="card stat"><span class="chip">${S(ic)}</span><div><small>${l}</small><strong class="${o.v?'':'nil'}">${E(o.v||'—')}</strong><em class="${o.tone||''}">${E(o.s||'No data yet')}</em></div></div>`}).join('');
 $('#cards').innerHTML=C.secs.map((s,i)=>`<section class="card" id="${s[0]}" style="grid-column:span ${s[4]};animation-delay:${i*50}ms"><div class="head"><span class="chip">${S(s[3])}</span><h2>${s[1]}</h2></div>${body(s,d)}</section>`).join('')}
const nm=(D.user&&D.user.name)||'',ini=nm?nm.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase():C.label[0],h=new Date().getHours();
$('#date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
$('#h1').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+(nm?', '+nm.split(' ')[0]:'');
$('#sub').textContent=C.sub;
$('#nav').innerHTML=`<a href="#top" class="on">${S('home')}<span>Overview</span></a>`+C.secs.map(s=>`<a href="#${s[0]}">${S(s[3])}<span>${s[1].replace('Today’s ','')}</span></a>`).join('');
$('#who').innerHTML=`<span class="av">${E(ini)}</span><div><b>${E(nm||C.label+' account')}</b><small>${E((D.user&&D.user.detail)||'DPS Millennium')}</small></div><a href="${role}-portal.html" aria-label="Log out">${S('out')}</a>`;
$('#chip').innerHTML=`<span class="av">${E(ini)}</span>`;
if(kids.length){$('#kidwrap').innerHTML=`<label class="pick">Child<select id="kid">${kids.map((k,i)=>`<option value="${i}">${E(k.name)}</option>`).join('')}</select></label>`;$('#kid').onchange=e=>{sel=+e.target.value;draw()}}
document.addEventListener('click',e=>{if(e.target.closest('.links button'))toast('This feature isn’t connected yet.')});
document.addEventListener('submit',e=>{e.preventDefault();toast('Leave requests aren’t connected yet.')});
draw();
if(window.IntersectionObserver){const A=[...document.querySelectorAll('#nav a')],io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)A.forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+x.target.id))}),{rootMargin:'-30% 0px -60% 0px'});document.querySelectorAll('.card[id]').forEach(c=>io.observe(c))}
</script></body></html>
